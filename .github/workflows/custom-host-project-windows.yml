name: Orca Host Project Windows
on:
  push:
    branches:
      - custom/host-project-grouping
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-host-project-windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ORCA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Test custom host grouping
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/sidebar-list/hosts/custom-host-project-grouping.test.ts
      - name: Build release assets
        run: pnpm run build:release
      - name: Type check
        run: pnpm run typecheck
      - name: Package unsigned Windows x64 installer
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          $env:ORCA_LOCAL_BUILD_VERSION = "$base-hostgroup.$env:GITHUB_RUN_NUMBER"
          pnpm run ensure:electron-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/orca-windows-setup.exe')) { throw 'Missing installer' }
          Get-FileHash 'dist/orca-windows-setup.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/SHA256.txt'
      - uses: actions/upload-artifact@v7
        with:
          name: orca-hostgroup-windows-x64
          path: |
            dist/orca-windows-setup.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
